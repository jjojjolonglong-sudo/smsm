 [hidden]{display:none!important}

<script>

const birth=s=>s.birth_day??0;

const IM=h=>h?Media.img(h,'onerror="this.remove()"'):'';
/* ---- 혈연 (4촌까지): 공통 조상까지의 세대 합 ---- */
function anc(id){const m=new Map([[id,0]]);let f=[id],d=0;while(f.length&&d<4){d++;const n=[];for(const x of f){const s=byId('sim',x);if(!s)continue;for(const p of[s.father,s.mother])if(p&&!m.has(p)){m.set(p,d);n.push(p)}}f=n}return m}
async function sync(){const ss=sims(),A=Object.fromEntries(ss.map(s=>[s.id,anc(s.id)])),up=[];
for(const a of ss)for(const b of ss){if(a==b)continue;let d=null;for(const[k,x]of A[a.id]){const y=A[b.id].get(k);if(y!=null&&x+y<=4&&(d==null||x+y<d))d=x+y}
const r=D.rel.find(r=>r.sim1==a.id&&r.sim2==b.id);
if(r){if((r.blood??null)!==d)up.push({...r,blood:d})}else if(d)up.push({id:nid(),sim1:a.id,sim2:b.id,blood:d,marry:false,friendly:true,social:null,comment:null})}
if(up.length)await put('rel',up)}
/* ---- 폼 ---- */
/* 이름 검색 드롭다운 (단일 sp / 다중 spm) */
const CBO={},chip=(v,t)=>`<span class=chip data-v="${v}" title="제거">${E(t)} ×</span>`;
function cbList(cb){const k=cb.dataset.k,i=cb.querySelector('.cbi'),q=cb._a?'':i.value.trim().toLowerCase(),m=cb.dataset.m,have=new Set([...cb.querySelectorAll('.chip')].map(c=>c.dataset.v)),l=cb.querySelector('.cbl'),
r=(CBO[k]||[]).filter(([a,b])=>!(m&&have.has(a))&&(!q||a===''||a==='__new'||String(b).toLowerCase().includes(q)));
l.innerHTML=r.slice(0,60).map(([a,b])=>`<div class=cbo data-v="${a}">${E(b)}</div>`).join('')+(r.length>60?'<div class=mut style="padding:4px 10px">… 계속 입력해서 좁혀 보세요</div>':'')||'<div class=mut style="padding:6px 10px">일치하는 심이 없어요</div>';l.hidden=false}
function cbPick(cb,v){const k=cb.dataset.k,o=(CBO[k]||[]).find(x=>x[0]==v);if(!o)return;
if(cb.dataset.m){if(v&&!cb.querySelector(`.chip[data-v="${v}"]`))cb.querySelector('.chips').insertAdjacentHTML('beforeend',chip(v,o[1]));cb.querySelector('.cbi').value='';cbList(cb)}
else{cb.querySelector('[type=hidden]').value=v;cb.querySelector('.cbi').value=v?o[1]:'';cb.querySelector('.cbl').hidden=true;const n=cb.nextElementSibling;
if(n&&n.classList.contains('nw')){n.hidden=v!='__new';if(k=='father'&&v=='__new'&&!n.children[1].value)n.children[1].value=$('#fm [name=family_name]').value}}}
function cbClose(){document.querySelectorAll('.cb').forEach(cb=>{cb.querySelector('.cbl').hidden=true;const i=cb.querySelector('.cbi');if(cb.dataset.m)i.value='';else{const h=cb.querySelector('[type=hidden]').value,o=(CBO[cb.dataset.k]||[]).find(x=>x[0]==h);i.value=h&&o?o[1]:''}})}
document.addEventListener('focusin',e=>{const t=e.target;if(t.classList&&t.classList.contains('cbi')){const cb=t.closest('.cb');cb._a=1;t.select();cbList(cb)}else if(!t.closest('.cb')&&document.querySelector('.cbl:not([hidden])'))cbClose()});

document.addEventListener('mousedown',e=>{const o=e.target.closest('.cbo');if(o){e.preventDefault();cbPick(o.closest('.cb'),o.dataset.v)}else if(!e.target.closest('.cb'))cbClose()});

document.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)c.remove()});
const msH=(k,L,sel)=>L.map(([a,b])=>`<label class=chk><input type=checkbox name=${k} value=${a} ${sel.includes(a)?'checked':''}>${E(b)}</label>`).join('');
function fld(f,v){const k=f.k,l=`<label>${f.l}</label>`,V=E(v??'');
switch(f.t){case'c':return`<label class=chk><input type=checkbox name=${k} ${v?'checked':''}>${f.l}</label>`;
case's':return l+`<select name=${k}>${f.o.map(([a,b])=>`<option value="${a}" ${a==(v??'')?'selected':''}>${E(b)}</option>`).join('')}</select>${f.nw?`<div class=nw hidden><input name=${k}_f placeholder="새 인물 이름"><input name=${k}_l placeholder="성"></div>`:''}`;

case'p':return l+`<input type=file name=${k} accept="image/*"><div class="im pv${f.w?' w':''}">${IM(v)}</div>`;
case'a':return l+`<textarea name=${k} rows=3>${V}</textarea>`;
case'h':return f.h;
case'sp':case'spm':{const m=f.t=='spm',L=Object.fromEntries(f.o);CBO[k]=f.o;
return l+`<div class=cb data-k=${k}${m?' data-m=1':''}>${m?`<div class=chips>${(v||[]).filter(i=>L[i]).map(i=>chip(i,L[i])).join('')}</div>`:`<input type=hidden name=${k} value="${E(v??'')}">`}<input class=cbi placeholder="${m?'이름을 입력해 추가':'이름 검색'}" value="${m||!v?'':E(L[v]||'')}" autocomplete=off><div class=cbl hidden></div></div>`+(f.nw?`<div class=nw${m?'':' hidden'}><input name=${k}_f placeholder="＋ 새 인물 이름"><input name=${k}_l placeholder="성"></div>`:'')}
default:return l+`<input name=${k} type=${{n:'number',d:'date'}[f.t]||'text'} value="${V}">`}}
function collect(f,fs){const o={};for(const x of fs){if(x.t=='p'||x.t=='h')continue;const e=f.elements[x.k];o[x.k]=x.t=='c'?e.checked:x.t=='m'?[...f.querySelectorAll(`[name=${x.k}]:checked`)].map(i=>i.value):x.t=='spm'?[...f.querySelectorAll(`.cb[data-k=${x.k}] .chip`)].map(c=>c.dataset.v):x.t=='n'?(e.value===''?null:+e.value):(e.value===''?null:e.value)}return o}
function modal(title,fs,v,save,del){const d=$('#dg');RM=del;
d.innerHTML=`<form id=fm><h3>${title}</h3>${fs.map(f=>fld(f,v[f.k])).join('')}<p id=er class=err></p><div class=bar><button type=button data-a=x>취소</button>${del?'<button type=button class=danger data-a=rm>삭제</button>':''}<button class=pri>저장</button></div></form>`;d.showModal();

$('#dg').addEventListener('change',e=>{const t=e.target;if(t.tagName=='SELECT'){const n=t.nextElementSibling;if(n&&n.classList.contains('nw')){n.hidden=t.value!='__new';if(t.name=='father'&&!n.children[1].value)n.children[1].value=$('#fm [name=family_name]').value}}

async function up(file,id){const s=await Media.save(file,id?{id}:{});const h=s.hash,o=s.original,er=s.originalError;s.close();if(o=='failed')alert('이미지는 저장됐지만 원본 보관에 실패했어요: '+er);return h}
const simOpts=(ex,blank=true)=>[...(blank?[['','—']]:[]),...sims().filter(s=>s.id!=ex).map(s=>[s.id,nm(s)])];
function playForm(p){const v={type:'clean',start_date:today(),...(p||{})},lt=p&&D.lifetime.find(l=>l.play==p.id);ST.forEach(k=>v['lt_'+k]=lt?lt[k]:k=='ghost'?null:DEF[k]);
modal(p?'플레이 수정':'새 플레이',[{k:'type',l:'종류',t:'s',o:[['clean','clean'],['dirty','dirty']]},{k:'goal',l:'골 (한 줄)',t:'t'},{k:'start_date',l:'시작일',t:'d'},{k:'end_date',l:'종료일',t:'d'},...ST.map((k,i)=>({k:'lt_'+k,l:`수명(일) · ${KO[i]}${k=='ghost'?' (비우면 무제한)':''}`,t:'n'}))],v,async o=>{
const pid=p?p.id:nid(),l0=p&&D.lifetime.find(l=>l.play==pid);

/* 생일 계산: 연령대(0~8)·일차(1~)를 나이(일)로 바꿔서, 기준 심의 생일에서 이 심의 생일을 구함 */
function calcBirth(md,a,v){const lt=D.lifetime.find(l=>l.play==S.play)||{},age=(i,d)=>{let t=0;for(let j=0;j<i;j++)t+=lt[ST[j]]||0;return t+d-1},

function simForm(s){const id=s?s.id:nid(),v=s||{sex:'womb'},opp=sx=>sx=='womb'?'testis':'womb',lt=D.lifetime.find(l=>l.play==S.play)||{};

/* ---- 가계도: 직계 3촌(2촌까지 선명), 방계 4촌(3촌까지 선명), 배우자는 중심 심만 표시 ---- */
function treeView(){const ss=sims();if(!ss.length)return'<p class=mut>심이 없어요</p>';
const f0=byId('sim',S.tf),fid=f0&&f0.play==S.play?S.tf:ss[0].id,FK=fid+'|0';S.tf=fid;
const K={};D.sim.forEach(s=>{for(const p of[s.father,s.mother])if(p)(K[p]=K[p]||[]).push(s.id)});
/* 1) 혈연 자리: 같은 심도 경로(세대)가 다르면 자리를 따로 가짐. 키 = 심id|세대 */
const B=new Map,ad=(id,lv,f,deg,an)=>{const k=id+'|'+lv,o=B.get(k);if(!o)B.set(k,{id,lv,f,deg,an});else{if(deg<o.deg){o.f=f;o.deg=deg}o.an=o.an||an}};
const dsc=(x,d1,d2,path)=>{const dr=!d1||!d2,deg=d1+d2;if(dr?deg<=3:deg<=4)ad(x,d2-d1,dr?deg>=3:deg>=4,deg,!d2);
if(d2<(d1?4-d1:3))for(const c of K[x]||[])if(!path.has(c)){path.add(c);dsc(c,d1,d2+1,path);path.delete(c)}};
const upw=(x,d1,path)=>{dsc(x,d1,0,new Set(path));if(d1<3){const s=byId('sim',x);for(const p of[s.father,s.mother])if(p&&byId('sim',p)&&!path.has(p)){path.add(p);upw(p,d1+1,path);path.delete(p)}}};
upw(fid,0,new Set([fid]));
/* 2) 카드. 부부선은 (직계 조상 줄에서 서로 메인 파트너인 부모) + (중심 심과 그 배우자)뿐. 나머지 배우자는 그리지 않음 */
const I=new Map,IX={},BL=new Set,mk=(key,id,lv,f,pin)=>{const i={key,id,lv,f,mt:[],pin};I.set(key,i);(IX[id+'|'+lv]=IX[id+'|'+lv]||[]).push(key);return i},
mate=(a,b)=>{if(!a.mt.includes(b.key)){a.mt.push(b.key);b.mt.push(a.key)}},mar=(a,b)=>byId('sim',a).partner==b||byId('sim',b).partner==a;
B.forEach(n=>{BL.add(n.id);mk(n.id+'|'+n.lv,n.id,n.lv,n.f,1).an=n.an});
for(const c of[...I.values()]){const s=byId('sim',c.id),f=s.father&&I.get(s.father+'|'+(c.lv-1)),m=s.mother&&I.get(s.mother+'|'+(c.lv-1));if(f&&m&&f.an&&m.an&&mar(f.id,m.id))mate(f,m)}
const q=byId('sim',fid).partner;
if(q&&byId('sim',q)){const nb=!BL.has(q),b=mk(q+'@'+FK,q,0,0,nb?1:0);mate(I.get(FK),b);   /* 배우자가 혈연이면 이 자리에 중복 카드 */
if(nb){const x=byId('sim',q);for(const p of[x.father,x.mother])if(p&&byId('sim',p)&&!IX[p+'|-1'])mk(p+'@'+b.key,p,-1,0,1);   /* 혈연이 아닌 배우자는 위아래 1촌까지 */
const fp=x.father&&I.get(x.father+'@'+b.key),mp=x.mother&&I.get(x.mother+'@'+b.key);if(fp&&mp&&mar(fp.id,mp.id))mate(fp,mp);
for(const c of K[q]||[])if(!IX[c+'|1'])mk(c+'@'+b.key,c,1,0,1)}}
/* 3) 부모 연결: 바로 윗줄 카드와만. 부부로 묶인 부모는 한 줄, 아니면 부모 각자의 카드 아래에서 따로 선이 나옴 */
const PK={},JT={},KD={};
I.forEach(c=>{if(!c.pin)return;const s=byId('sim',c.id),cs=[s.father,s.mother].filter(Boolean).map(p=>IX[p+'|'+(c.lv-1)]||[]).filter(a=>a.length);if(!cs.length)return;
let r=cs.map(a=>a[0]),j=false;if(cs.length==2)for(const a of cs[0]){const b=cs[1].find(x=>I.get(a).mt.includes(x));if(b){r=[a,b];j=true;break}}
PK[c.key]=r;JT[c.key]=j;r.forEach(p=>(KD[p]=KD[p]||[]).push(c.key))});
/* 4) 배치 */
const L=[...new Set([...I.values()].map(n=>n.lv))].sort((a,b)=>a-b),R={},X={},bd=k=>birth(byId('sim',I.get(k).id));
L.forEach(l=>R[l]=[...I.keys()].filter(k=>I.get(k).lv==l).sort((a,b)=>bd(a)-bd(b)));
const place=()=>L.forEach(l=>R[l].forEach((k,i)=>X[k]=i-(R[l].length-1)/2)),avg=a=>a.reduce((t,k)=>t+X[k],0)/a.length;place();
const sweep=down=>{for(const l of down?L:[...L].reverse()){const row=R[l],key={};
row.forEach(k=>{const ns=down?(PK[k]||[]):(KD[k]||[]);if(ns.length)key[k]=avg(ns)});
row.forEach(k=>{if(key[k]==null){const q=I.get(k).mt.find(m=>key[m]!=null&&row.includes(m));key[k]=q!=null?key[q]:X[k]}});
const out=[],sn=new Set;
for(const k of[...row].sort((a,b)=>key[a]-key[b])){if(sn.has(k))continue;sn.add(k);const ms=I.get(k).mt.filter(m=>!sn.has(m)&&row.includes(m));ms.forEach(m=>sn.add(m));
out.push(...ms.filter((_,i)=>i%2),k,...ms.filter((_,i)=>!(i%2)))}
R[l]=out;place()}};
sweep(1);sweep(0);sweep(1);
/* 5) 그리기: 중심 카드는 실제로 더 크게 잡고(88px) 간격도 넉넉히 */
const NW=68,FW=88,W=100,RH=180,P=24,cw=k=>k==FK?FW:NW,ch=k=>cw(k)*4/3+18,xs=Object.values(X),mn=Math.min(...xs),w=(Math.max(...xs)-mn)*W+FW+P*2,h=(L.length-1)*RH+cw(FK)*4/3+18+P*2;
const cx=k=>(X[k]-mn)*W+P+FW/2,py=k=>L.indexOf(I.get(k).lv)*RH+P,fd=k=>I.get(k).f;
let sv='';const ln=(x1,y1,x2,y2,o)=>sv+=`<path d="M${x1} ${y1}V${y2-18}H${x2}V${y2}" opacity="${o}"/>`;
for(const k in PK){const pa=PK[k],o=fd(k)||pa.some(fd)?.3:.8;
if(JT[k])ln((cx(pa[0])+cx(pa[1]))/2,py(pa[0])+45,cx(k),py(k),o);else pa.forEach(p=>ln(cx(p),py(p)+ch(p),cx(k),py(k),o))}
const sn=new Set;I.forEach(a=>a.mt.forEach(m=>{if(sn.has(m+'/'+a.key))return;sn.add(a.key+'/'+m);const[l,r]=X[a.key]<X[m]?[a.key,m]:[m,a.key];
sv+=`<path d="M${cx(l)+cw(l)/2} ${py(l)+45}H${cx(r)-cw(r)/2}" opacity="${I.get(l).f||I.get(r).f?.3:.8}"/>`}));
const nd=[...I.values()].map(n=>{const s=byId('sim',n.id);return`<div class="tn${n.f?' f':''}${n.key==FK?' me':''}${n.id==fid&&n.key!=FK?' dp':''}" style="left:${cx(n.key)-cw(n.key)/2}px;top:${py(n.key)}px" data-a=tree data-id=${n.id}><div class=im>${IM(thumb(s))}</div><div class=nm>${E(nm(s))}</div></div>`}).join('');
return`<div class=bar><select id=ts style="width:auto">${ss.map(s=>`<option value=${s.id} ${s.id==fid?'selected':''}>${E(nm(s))}</option>`).join('')}</select><span class=mut>굵은 테두리: 중심 심 (점선은 그 심의 중복) · 흐림: 직계 3촌·방계 4촌 · 배우자는 중심 심만 표시</span></div><div id=tr class=tr><div style="position:relative;width:${w}px;height:${h}px"><svg width="${w}" height="${h}" fill="none" stroke="currentColor">${sv}</svg>${nd}</div></div>`}
function simView(s){const L=id=>{const q=id&&byId('sim',id);return q?`<a data-a=sim data-id=${id}>${E(nm(q))}</a>`:'-'},pr=D.profile.filter(x=>x.sim==s.id);

/* ---- 이벤트 ---- */
document.addEventListener('change',e=>{if(e.target.id=='ps'){S.play=e.target.value;S.sim=null;S.fs='';S.tf='';render()}if(e.target.id=='fs'){S.fs=e.target.value;render()}if(e.target.id=='ts'){S.tf=e.target.value;render()}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;try{switch(a){
case'tab':S.tab=id;S.sim=null;break;case'sim':S.tab='sim';S.sim=id;break;case'back':S.sim=null;break;
case'newplay':return playForm();case'editplay':return playForm(curP());
case'endplay':{const p=curP();await put('play',{...p,end_date:p.end_date?null:today()});break}
case'addsim':return simForm();case'editsim':return simForm(byId('sim',id));
case'addprof':return profForm(null,byId('sim',id));case'ep':{const x=byId('profile',id);return profForm(x,byId('sim',x.sim))}
case'addrel':return relForm();case'er':return relForm(byId('rel',id));
case'addalb':return albForm();case'ea':$('#vw').close();return albForm(byId('album',id));
case'va':return viewAlb(byId('album',id));case'vx':$('#vw').close();return;
case'relsim':S.fs=id;S.tab='rel';S.sim=null;break;case'albsim':S.fs=id;S.tab='alb';S.sim=null;break;
case'tree':S.tf=id;break;case'treesim':S.tf=id;S.tab='tree';S.sim=null;break;
case'x':$('#dg').close();return;
case'rm':if(!confirm('삭제할까요?'))return;try{await RM();$('#dg').close();render()}catch(x){$('#er').textContent=x.message}return;
case'dir':try{await Media.folder.connect();FN=await Media.folder.name()}catch(x){if(x.name!='AbortError')alert(x.message)}break;
case'sync':{const o=$('#ss');try{o.textContent='받는 중…';const r=await Media.sync({onProgress:p=>o.textContent=p.done+'/'+p.total});o.textContent=r.total?`완료 ${r.done}/${r.total}`+(r.failed.length?` · 실패 ${r.failed.length}`:''):'대기 중인 원본 없음'}catch(x){o.textContent=x.message}return}
case'logout':{const s=SES();setSES(null);try{s&&await fetch(`${SB}/auth/v1/logout`,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+s.access_token}})}catch(x){}return boot()}}render()}catch(x){alert(x.message)}});
/* ---- 시작 ---- */
function loginView(){$('#app').innerHTML=`<form id=lf class=lg><h2 style="margin:0">smsm</h2><input id=em type=email placeholder="이메일" autocomplete=username><input id=pw type=password placeholder="비밀번호" autocomplete=current-password><button class=pri>로그인</button><p id=lm class=mut></p></form>`;
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lm').textContent='로그인 중…';try{await gotrue('password',{email:$('#em').value.trim(),password:$('#pw').value});boot()}catch(x){$('#lm').textContent=x.message}}}
async function boot(){if(!SES())return loginView();try{FN=await Media.folder.name().catch(()=>'');await load();S.play=LSget('smsm_play');render()}catch(x){$('#app').innerHTML=`<main><p class=err>${E(x.message)}</p><button data-a=logout>로그아웃</button></main>`}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
